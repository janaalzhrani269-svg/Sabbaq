<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: #F5F5DC; /* الخلفية بيج */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .iphone-frame {
            width: 375px;
            height: 812px;
            background-color: white; /* خلفية التطبيق بيضاء */
            border: 16px solid black; /* إطار الهاتف */
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .top-bar {
            background-color: #5E7D9A;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 22px;
            font-weight: bold;
        }
        .splash-screen {
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <div class="splash-screen" id="splash">
            <div class="top-bar">مِهاد | Mehaad</div>
        </div>
    </div>
</body>
</html>
