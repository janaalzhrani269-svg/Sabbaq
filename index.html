const STATUS_META = {
  visited: { color: "#4A9B6E", label: "تمت الزيارة" },
  planned: { color: "#D4AF37", label: "مخطط للزيارة" },
  unvisited: { color: "#5A4A7A", label: "لم تتم الزيارة" },

/* ---------- SHARED ---------- */
function StatusDot({ status }) {
  const meta = STATUS_META[status];
  return (
    <span style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,color:meta.color}}>
      <span style={{width:8,height:8,borderRadius:99,background:meta.color}} />
      {meta.label}
    </span>
  );
}

function RegionCard({ region, onOpen }) {
  return (
    <button onClick={() => onOpen(region)} style={{
      textAlign:"right", width:"100%", borderRadius:16, padding:16,
      background:"linear-gradient(155deg, #2D1B4E 0%, #241640 100%)",
      border:"1px solid rgba(212,175,55,0.18)"
    }}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
        <div>
          <h3 style={{fontWeight:700,fontSize:16,color:"#F0EBE3",margin:0}}>{region.name}</h3>
          <p style={{fontSize:12,color:"#A89BC4",margin:"2px 0 0"}}>{region.capital}</p>
        </div>
        <Icon name="chevronLeft" size={18} color="#A89BC4" />
      </div>
      <p style={{fontSize:14,marginTop:8,lineHeight:1.6,color:"#C9BEDB"}}>{region.desc}</p>
      <div style={{marginTop:12,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <StatusDot status={region.status} />
        <div style={{display:"flex",gap:4}}>
          {region.cats.slice(0,3).map(c => {
            const cat = CATS.find(x => x.id === c);
            return (
              <span key={c} style={{width:24,height:24,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(212,175,55,0.12)"}}>
                <Icon name={cat ? cat.icon : "compass"} size={12} color="#D4AF37" />
              </span>
            );
          })}
        </div>
      </div>
    </button>
  );
}

/* ---------- TAB: REGIONS ---------- */
function RegionsTab({ onOpenRegion, tier, setTier }) {
  const [query, setQuery] = useState("");
  const [activeCat, setActiveCat] = useState(null);
  const [showTiers, setShowTiers] = useState(false);

  const filtered = useMemo(() => REGIONS.filter(r => {
    const mq = !query || r.name.includes(query) || r.capital.includes(query) || r.top.some(t => t.includes(query));
    const mc = !activeCat || r.cats.includes(activeCat);
    return mq && mc;
  }), [query, activeCat]);

  const currentTier = TIERS.find(t => t.id === tier);

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{padding:"20px 16px 12px",background:"#1A0E2E"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <div>
            <h1 style={{fontSize:24,fontWeight:800,color:"#F0EBE3",margin:0}}>سَبّاق</h1>
            <p style={{fontSize:12,color:"#8A7CAE",margin:0}}>اكتشف ١٣ منطقة سعودية</p>
          </div>
          <button onClick={() => setShowTiers(true)} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:99,background:"rgba(212,175,55,0.12)",border:"1px solid rgba(212,175,55,0.3)"}}>
            <span style={{width:8,height:8,borderRadius:99,background:currentTier.color}} />
            <span style={{fontSize:12,fontWeight:500,color:"#D4AF37"}}>{currentTier.label}</span>
          </button>
        </div>

        <div style={{position:"relative"}}>
          <span style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)"}}>
            <Icon name="search" size={16} color="#8A7CAE" />
          </span>
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="ابحثي عن وجهة، مدينة، أو نشاط..."
            style={{width:"100%",padding:"10px 36px 10px 12px",borderRadius:12,fontSize:14,outline:"none",background:"#2D1B4E",color:"#F0EBE3",border:"1px solid rgba(255,255,255,0.06)"}} />
        </div>

        <div style={{display:"flex",gap:8,marginTop:12,overflowX:"auto",paddingBottom:4}}>
          {CATS.map(c => {
            const active = activeCat === c.id;
            return (
              <button key={c.id} onClick={() => setActiveCat(active ? null : c.id)}
                style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:99,whiteSpace:"nowrap",fontSize:12,fontWeight:500,
                  background: active ? "#3B82C4" : "rgba(255,255,255,0.04)", color: active ? "#fff" : "#C9BEDB",
                  border: active ? "1px solid #3B82C4" : "1px solid rgba(255,255,255,0.08)"}}>
                <Icon name={c.icon} size={13} />
                {c.label}
              </button>
            );
          })}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"8px 16px 16px",background:"#1A0E2E"}}>
        <div style={{display:"grid",gap:12}}>
          {filtered.map(r => <RegionCard key={r.id} region={r} onOpen={onOpenRegion} />)}
          {filtered.length === 0 && <p style={{textAlign:"center",fontSize:14,padding:"40px 0",color:"#8A7CAE"}}>لا توجد نتائج مطابقة. جربي كلمة بحث أخرى.</p>}
        </div>
      </div>

      {showTiers && (
        <div onClick={() => setShowTiers(false)} style={{position:"absolute",inset:0,zIndex:50,display:"flex",alignItems:"flex-end",background:"rgba(0,0,0,0.6)"}}>
          <div onClick={e => e.stopPropagation()} style={{width:"100%",borderRadius:"24px 24px 0 0",padding:20,background:"#2D1B4E",borderTop:"1px solid rgba(212,175,55,0.25)"}}>
            <div style={{width:40,height:4,borderRadius:99,margin:"0 auto 16px",background:"#5A4A7A"}} />
            <h3 style={{fontSize:18,fontWeight:700,marginBottom:4,color:"#F0EBE3"}}>فئة السفر</h3>
            <p style={{fontSize:12,marginBottom:16,color:"#8A7CAE"}}>تخصيص المحتوى والاقتراحات بناءً على نمط رحلتك</p>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {TIERS.map(t => (
                <button key={t.id} onClick={() => { setTier(t.id); setShowTiers(false); }}
                  style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,borderRadius:12,
                    background: tier===t.id ? "rgba(212,175,55,0.1)" : "rgba(255,255,255,0.03)",
                    border: tier===t.id ? `1px solid ${t.color}` : "1px solid rgba(255,255,255,0.06)"}}>
                  <div style={{textAlign:"right"}}>
                    <p style={{fontSize:14,fontWeight:600,margin:0,color:"#F0EBE3"}}>{t.label}</p>
                    <p style={{fontSize:12,margin:0,color:"#8A7CAE"}}>{t.sub}</p>
                  </div>
                  <span style={{width:12,height:12,borderRadius:99,background:t.color}} />
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

  const counts = useMemo(() => {
    const c = { visited:0, planned:0, unvisited:0 };
    REGIONS.forEach(r => c[r.status]++);
    return c;
  }, []);

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#1A0E2E"}}>
      <div style={{padding:"20px 16px 12px"}}>
        <h1 style={{fontSize:20,fontWeight:800,color:"#F0EBE3",margin:0}}>خريطة رحلتك</h1>
        <p style={{fontSize:12,marginTop:4,color:"#8A7CAE"}}>تتبعي المناطق التي زرتيها وخططي للقادمة</p>
        <div style={{display:"flex",gap:12,marginTop:12}}>
          {Object.entries(STATUS_META).map(([key,meta]) => (
            <div key={key} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#C9BEDB"}}>
              <span style={{width:10,height:10,borderRadius:99,background:meta.color}} />
              {meta.label} ({counts[key]})
            </div>
          ))}
        </div>
      </div>

      <div style={{flex:1,position:"relative",padding:"0 8px"}}>
        <svg viewBox="0 0 450 560" style={{width:"100%",height:"100%"}}>
          <defs>
            <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
              <stop offset="0%" stopColor="#2D1B4E" />
              <stop offset="100%" stopColor="#1A0E2E" />
            </radialGradient>
          </defs>
          <rect x="0" y="0" width="450" height="560" fill="url(#bgGlow)" rx="20" />
          {REGIONS.map(r => {
            const pos = MAP_POS[r.id];
            if (!pos) return null;
            const meta = STATUS_META[r.status];
            const isHovered = hovered === r.id;
            return (
              <g key={r.id} onClick={() => onOpenRegion(r)} onMouseEnter={() => setHovered(r.id)} onMouseLeave={() => setHovered(null)} style={{cursor:"pointer"}}>
                {isHovered && <circle cx={pos.x} cy={pos.y} r="22" fill={meta.color} opacity="0.15" />}
                <circle cx={pos.x} cy={pos.y} r={isHovered ? 11 : 9} fill={meta.color} opacity={r.status === "unvisited" ? 0.5 : 1} stroke="#1A0E2E" strokeWidth="2" />
                <text x={pos.x} y={pos.y + 24} textAnchor="middle" fontSize="11" fill={isHovered ? "#F0EBE3" : "#A89BC4"} fontFamily="Tajawal, sans-serif" fontWeight={isHovered ? "700" : "400"}>
                  {r.name}
                </text>
              </g>
            );
          })}
        </svg>
      </div>

      <div style={{padding:"0 16px 16px"}}>
        <div style={{borderRadius:16,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between",background:"#2D1B4E"}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <Icon name="sparkles" size={16} color="#D4AF37" />
            <span style={{fontSize:12,color:"#C9BEDB"}}>{counts.visited} من ١٣ منطقة مكتملة</span>
          </div>
          <div style={{width:96,height:6,borderRadius:99,overflow:"hidden",background:"rgba(255,255,255,0.08)"}}>
            <div style={{height:"100%",borderRadius:99,width:`${(counts.visited/13)*100}%`,background:"#4A9B6E"}} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- TAB: ASSISTANT ---------- */
const SUGGESTIONS = ["اقترح لي وجهة لعائلة","أفضل وجهات الشتاء","جدول زيارة ليوم واحد في جدة","أبغى جدول ٣ أيام في العلا"];

function AssistantTab() {
  const [messages, setMessages] = useState([
    { role:"assistant", text:"أهلاً بك في مساعد سبّاق 🤖\nاسأليني عن أي وجهة، برنامج رحلة، أو أفضل وقت للزيارة في السعودية." }
  ]);
  const [input, setInput] = useState("");

  const send = (text) => {
    if (!text.trim()) return;
    setMessages(m => [...m, { role:"user", text }]);
    setInput("");
    setTimeout(() => {
      setMessages(m => [...m, { role:"assistant", text:"هذا نموذج تجريبي — في النسخة الكاملة سيتم ربط المساعد بقاعدة بيانات الوجهات لإعداد جدول مخصص لك بناءً على المنطقة والمدة ونوع الرحلة." }]);
    }, 600);
  };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#1A0E2E"}}>
      <div style={{padding:"20px 16px 12px",display:"flex",alignItems:"center",gap:8}}>
        <div style={{width:36,height:36,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(212,175,55,0.12)"}}>
          <Icon name="chat" size={18} color="#D4AF37" />
        </div>
        <div>
          <h1 style={{fontSize:16,fontWeight:700,color:"#F0EBE3",margin:0}}>المساعد السياحي</h1>
          <p style={{fontSize:11,margin:0,color:"#8A7CAE"}}>متخصص في سياحة السعودية فقط</p>
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"8px 16px",display:"flex",flexDirection:"column",gap:12}}>
        {messages.map((m,i) => (
          <div key={i} style={{display:"flex",justifyContent: m.role==="user" ? "flex-start" : "flex-end"}}>
            <div style={{maxWidth:"80%",borderRadius:16,padding:"10px 16px",fontSize:14,lineHeight:1.6,whiteSpace:"pre-line",
              background: m.role==="user" ? "#3B82C4" : "#2D1B4E", color: m.role==="user" ? "#fff" : "#E8E1F2",
              border: m.role==="assistant" ? "1px solid rgba(212,175,55,0.15)" : "none"}}>
              {m.text}
            </div>
          </div>
        ))}
      </div>

      <div style={{padding:"0 16px 8px"}}>
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:8}}>
          {SUGGESTIONS.map(s => (
            <button key={s} onClick={() => send(s)} style={{whiteSpace:"nowrap",fontSize:12,padding:"6px 12px",borderRadius:99,background:"rgba(255,255,255,0.05)",color:"#C9BEDB",border:"1px solid rgba(255,255,255,0.1)"}}>
              {s}
            </button>
          ))}
        </div>
      </div>

      <div style={{padding:"0 16px 20px",display:"flex",alignItems:"center",gap:8}}>
        <button style={{width:40,height:40,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"#2D1B4E"}}>
          <Icon name="mic" size={16} color="#A89BC4" />
        </button>
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === "Enter" && send(input)} placeholder="اكتبي سؤالك هنا..."
          style={{flex:1,padding:"10px 16px",borderRadius:99,fontSize:14,outline:"none",background:"#2D1B4E",color:"#F0EBE3",border:"1px solid rgba(255,255,255,0.08)"}} />
        <button onClick={() => send(input)} style={{width:40,height:40,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,background:"#D4AF37"}}>
          <Icon name="send" size={16} color="#1A0E2E" />
        </button>
      </div>
    </div>
  );
}

        <p style={{fontSize:12,marginTop:4,color:"#8A7CAE"}}>تواصل فوري بينك وبين الزائر الأجنبي</p>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:12,margin:"16px 0"}}>

          background: direction==="ar-en" ? "rgba(212,175,55,0.12)" : "#2D1B4E",

        </button>
        <div style={{flex:1,textAlign:"center",padding:"12px 0",borderRadius:12,
          background: direction==="en-ar" ? "rgba(212,175,55,0.12)" : "#2D1B4E",
          border: direction==="en-ar" ? "1px solid #D4AF37" : "1px solid transparent"}}>
          <p style={{fontSize:14,fontWeight:600,margin:0,color:"#F0EBE3"}}>English</p>

      </div>

      <div style={{flex:1,display:"flex",flexDirection:"column",gap:12}}>

          <p style={{fontSize:11,marginBottom:4,color:"#8A7CAE"}}>{direction==="ar-en" ? "أنتِ (عربي)" : "الزائر (English)"}</p>
          <p style={{fontSize:14,color:"#C9BEDB"}}>اضغطي على المايك وابدئي الحديث...</p>
        </div>
        <div style={{borderRadius:16,padding:16,minHeight:110,background:"#241640",border:"1px solid rgba(212,175,55,0.15)"}}>
          <p style={{fontSize:11,marginBottom:4,color:"#D4AF37"}}>{direction==="ar-en" ? "Translation (English)" : "الترجمة (عربي)"}</p>
          <p style={{fontSize:14,color:"#8A7CAE"}}>ستظهر الترجمة هنا...</p>
        </div>
      </div>

      <div style={{display:"flex",flexDirection:"column",alignItems:"center",padding:"12px 0 24px"}}>
        <button onClick={() => setRecording(r => !r)} style={{width:64,height:64,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",
          background: recording ? "#B5673A" : "#D4AF37", boxShadow: recording ? "0 0 0 8px rgba(181,103,58,0.15)" : "none"}}>
          <Icon name="mic" size={26} color="#1A0E2E" />
        </button>
        <p style={{fontSize:12,marginTop:8,color:"#8A7CAE"}}>{recording ? "...يستمع الآن" : "اضغطي للتحدث"}</p>
      </div>
    </div>
  );
}

/* ---------- REGION DETAIL ---------- */
function RegionDetail({ region, onClose }) {
  if (!region) return null;
  return (
    <div style={{position:"absolute",inset:0,zIndex:50,display:"flex",flexDirection:"column",background:"#1A0E2E"}}>
      <div style={{position:"relative",padding:"20px 16px 16px",background:"linear-gradient(155deg, #2D1B4E, #1A0E2E)"}}>
        <button onClick={onClose} style={{position:"absolute",left:16,top:20,width:32,height:32,borderRadius:99,display:"flex",alignItems:"center",justifyContent:"center",background:"rgba(255,255,255,0.08)"}}>
          <Icon name="x" size={16} color="#F0EBE3" />
        </button>
        <h1 style={{fontSize:24,fontWeight:800,color:"#F0EBE3",margin:0,paddingRight:4}}>{region.name}</h1>
        <p style={{fontSize:14,marginTop:4,color:"#A89BC4"}}>{region.capital}</p>
        <div style={{marginTop:8}}><StatusDot status={region.status} /></div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"16px 16px 24px",display:"flex",flexDirection:"column",gap:20}}>
        <div>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:6,color:"#D4AF37"}}>نبذة عن المنطقة</h3>
          <p style={{fontSize:14,lineHeight:1.7,color:"#C9BEDB"}}>{region.desc}</p>
        </div>

        <div>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:8,color:"#D4AF37"}}>أشهر الوجهات السياحية</h3>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {region.top.map(t => (
              <div key={t} style={{borderRadius:12,padding:12,display:"flex",alignItems:"center",gap:8,background:"#2D1B4E"}}>
                <Icon name="mapPin" size={14} color="#4A9B6E" />
                <span style={{fontSize:12,color:"#E8E1F2"}}>{t}</span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:8,display:"flex",alignItems:"center",gap:6,color:"#D4AF37"}}>
            <Icon name="hotel" size={14} /> الفنادق
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {region.hotels.map(h => (
              <div key={h.name} style={{borderRadius:12,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between",background:"#2D1B4E"}}>
                <span style={{fontSize:14,color:"#E8E1F2"}}>{h.name}</span>
                <span style={{display:"flex",gap:2}}>
                  {Array.from({length:h.stars}).map((_,i) => <Icon key={i} name="star" size={11} color="#D4AF37" fill="#D4AF37" />)}
                </span>
              </div>
            ))}
          </div>
        </div>

        <div>
          <h3 style={{fontSize:14,fontWeight:700,marginBottom:8,display:"flex",alignItems:"center",gap:6,color:"#D4AF37"}}>
            <Icon name="food" size={14} /> المطاعم والمقاهي
          </h3>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {region.food.map(f => (
              <div key={f.name} style={{borderRadius:12,padding:12,display:"flex",alignItems:"center",justifyContent:"space-between",background:"#2D1B4E"}}>
                <span style={{fontSize:14,color:"#E8E1F2"}}>{f.name}</span>
                <span style={{fontSize:12,color:"#8A7CAE"}}>{f.kind}</span>
              </div>
            ))}
          </div>
        </div>

        <div style={{display:"flex",gap:8,paddingTop:4}}>
          <button style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 0",borderRadius:12,fontSize:12,fontWeight:500,background:"#3B82C4",color:"#fff"}}>
            <Icon name="link" size={13} /> خرائط جوجل
          </button>
          <button style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"10px 0",borderRadius:12,fontSize:12,fontWeight:500,background:"rgba(255,255,255,0.06)",color:"#C9BEDB"}}>
            <Icon name="link" size={13} /> VisitSaudi
          </button>
        </div>
      </div>
    </div>
  );
}

/* ---------- ROOT ---------- */
const TABS = [
  { id:"regions", label:"مناطق", icon:"compass" },
  { id:"map", label:"خريطة", icon:"mapPin" },
  { id:"assistant", label:"مساعد", icon:"chat" },
  { id:"translator", label:"مترجم", icon:"languages" },
];

function App() {
  const [tab, setTab] = useState("regions");
  const [openRegion, setOpenRegion] = useState(null);
  const [tier, setTier] = useState(3);

  return (
    <div dir="rtl" style={{position:"relative",width:"100%",height:800,overflow:"hidden",borderRadius:32,display:"flex",flexDirection:"column",background:"#1A0E2E",boxShadow:"0 20px 60px rgba(0,0,0,0.5)"}}>
      <div style={{flex:1,overflow:"hidden",position:"relative"}}>
        {tab === "regions" && <RegionsTab onOpenRegion={setOpenRegion} tier={tier} setTier={setTier} />}
        {tab === "map" && <MapTab onOpenRegion={setOpenRegion} />}
        {tab === "assistant" && <AssistantTab />}
        {tab === "translator" && <TranslatorTab />}
        <RegionDetail region={openRegion} onClose={() => setOpenRegion(null)} />
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-around",padding:"10px 8px",flexShrink:0,background:"#150B26",borderTop:"1px solid rgba(212,175,55,0.12)"}}>
        {TABS.map(t => {
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"6px 12px",borderRadius:12,background: active ? "rgba(212,175,55,0.1)" : "transparent"}}>
              <Icon name={t.icon} size={20} color={active ? "#D4AF37" : "#6B5C8A"} strokeWidth={active ? 2.4 : 2} />
              <span style={{fontSize:10,fontWeight:500,color: active ? "#D4AF37" : "#6B5C8A"}}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
